name: Daily Content Automation

on:
  schedule:
    - cron: "0 23 * * *" # 23:00 UTC = 06:00 WIB
  workflow_dispatch: # tombol jalankan manual

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scraping-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraping-data/requirements.txt

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Trigger web deploy
        if: success()
        run: curl -fsS -X POST "${{ secrets.CF_DEPLOY_HOOK }}"
